<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Robô Carteiro Auto-Send" data-testid="robot-mail-icon">
  <!-- Antena do Robô -->
  <g data-part="antenna">
    <line x1="24" y1="11" x2="24" y2="6" stroke="#5288c1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="5" r="3" fill="#64b5f6"/>
    <circle cx="24" cy="5" r="1.2" fill="#ffffff"/>
    <path d="M19 4C17.5 5 17.5 7 19 8" stroke="#64b5f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M29 4C30.5 5 30.5 7 29 8" stroke="#64b5f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <!-- Orelhas / Parafusos laterais -->
  <rect x="7" y="16" width="3" height="7" rx="1.5" fill="#5288c1"/>
  <rect x="38" y="16" width="3" height="7" rx="1.5" fill="#5288c1"/>

  <!-- Cabeça do Robô -->
  <rect x="10" y="10" width="28" height="18" rx="5" fill="#2b5278" stroke="#5288c1" stroke-width="2"/>

  <!-- Viseira / Tela dos olhos -->
  <rect x="14" y="14" width="20" height="10" rx="3" fill="#17212b"/>

  <!-- Olhos digitais luminosos -->
  <circle cx="19" cy="19" r="2.2" fill="#64b5f6"/>
  <circle cx="19" cy="18.5" r="0.8" fill="#ffffff"/>
  <circle cx="29" cy="19" r="2.2" fill="#64b5f6"/>
  <circle cx="29" cy="18.5" r="0.8" fill="#ffffff"/>

  <!-- Mãos robóticas segurando o envelope -->
  <path d="M8 32C7 32 6 34 6 36C6 38 7 40 9 40" stroke="#5288c1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 32C41 32 42 34 42 36C42 38 41 40 39 40" stroke="#5288c1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Envelope do Robô Carteiro -->
  <g data-part="envelope">
    <rect x="8" y="25" width="32" height="19" rx="3" fill="#1c2733" stroke="#5288c1" stroke-width="2"/>
    <path d="M9 26L24 36L39 26" stroke="#64b5f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 43L19 33M39 43L29 33" stroke="#5288c1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <circle cx="24" cy="35" r="3.5" fill="#5288c1"/>
    <path d="M22.5 35L25.5 33.5L24 36.5L23.5 35.3L22.5 35Z" fill="#ffffff"/>
  </g>
</svg>
